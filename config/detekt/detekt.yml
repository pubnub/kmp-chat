# Overrides only - applied on top of detekt's default config (buildUponDefaultConfig = true).
# Existing issues are tracked in config/detekt/baseline-<module>.xml (regenerate with `./gradlew detektBaseline`).
# Regenerate baselines only in a dedicated commit and review the diff - regenerating also accepts any new violation.
# Analysed projects: every project applying `pubnub.shared` (root pubnub-chat, pubnub-chat-api, pubnub-chat-impl,
# pubnub-chat-test); non-test source sets only. The root project has no findings, so it has no baseline file.
# pubnub-3p-diff-match-patch is vendored third-party code and is intentionally not analysed.

complexity:
  LongParameterList:
    # entity constructors and factory/update methods (Channel, User, Message, ...) take many parameters by design
    functionThreshold: 10
    constructorThreshold: 15
    ignoreDefaultParameters: true
    ignoreDataClasses: true
  TooManyFunctions:
    # Chat / Channel / Message facades expose the whole API surface
    thresholdInFiles: 30
    thresholdInClasses: 30
    thresholdInInterfaces: 30
    thresholdInObjects: 30
    ignoreOverridden: true

style:
  # handled by ktlint (max-line-length is disabled there too)
  MaxLineLength:
    active: false
  # handled by ktlint (no-wildcard-imports)
  WildcardImport:
    active: false
